<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cisco-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00bceb"/>
      <stop offset="100%" stop-color="#049fd9"/>
    </linearGradient>
    <linearGradient id="accent-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#accent-glow)"/>
  
  <!-- Subtle Grid -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
  </g>

  <!-- Decorative Network Nodes -->
  <circle cx="680" cy="100" r="120" fill="#00bceb" opacity="0.06" filter="url(#glow)"/>
  <circle cx="120" cy="350" r="90" fill="#a855f7" opacity="0.08" filter="url(#glow)"/>

  <!-- Cisco Iconic Bridge Bars / Nodes -->
  <g transform="translate(400, 150)" text-anchor="middle">
    <!-- Stylized Bridge Bars -->
    <g fill="url(#cisco-cyan)" filter="url(#glow)">
      <rect x="-100" y="-30" width="10" height="60" rx="5"/>
      <rect x="-70" y="-45" width="10" height="90" rx="5"/>
      <rect x="-40" y="-20" width="10" height="40" rx="5"/>
      <rect x="-10" y="-55" width="10" height="110" rx="5"/>
      <rect x="20" y="-20" width="10" height="40" rx="5"/>
      <rect x="50" y="-45" width="10" height="90" rx="5"/>
      <rect x="80" y="-30" width="10" height="60" rx="5"/>
    </g>
  </g>

  <!-- Titles -->
  <text x="400" y="270" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="800" font-size="34" fill="#ffffff" letter-spacing="2">
    CISCO NETWORKING ACADEMY
  </text>
  <text x="400" y="315" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="600" font-size="20" fill="#00bceb" letter-spacing="3">
    CCNA • CYBERSECURITY • PYTHON ESSENTIALS
  </text>
  <text x="400" y="355" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="400" font-size="15" fill="#94a3b8" letter-spacing="1">
    Enterprise Routing, Switching &amp; Network Automation
  </text>
</svg>
