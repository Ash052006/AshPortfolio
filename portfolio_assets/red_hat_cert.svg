<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f0a0a"/>
      <stop offset="50%" stop-color="#0e0404"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="red-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ee0000"/>
      <stop offset="100%" stop-color="#ff4444"/>
    </linearGradient>
    <linearGradient id="red-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ee0000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg3)"/>
  <rect width="800" height="450" fill="url(#red-glow)"/>

  <!-- Linux Command Line Grid Accent -->
  <g stroke="rgba(238,0,0,0.06)" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="190" x2="800" y2="190"/>
    <line x1="0" y1="260" x2="800" y2="260"/>
    <line x1="0" y1="330" x2="800" y2="330"/>
  </g>

  <!-- Red Hat Fedora / Linux Emblem -->
  <g transform="translate(400, 120)" text-anchor="middle" filter="url(#glow3)">
    <ellipse cx="0" cy="20" rx="70" ry="12" fill="url(#red-grad)"/>
    <path d="M -40,20 C -40,-15 40,-15 40,20 Z" fill="url(#red-grad)"/>
    <!-- Shadow hat ribbon -->
    <path d="M -38,16 C -10,13 10,13 38,16 L 39,22 C 10,19 -10,19 -39,22 Z" fill="#111111"/>
    <!-- Terminal prompt prompt symbol -->
    <text x="0" y="-30" font-family="monospace" font-size="28" font-weight="bold" fill="#ff4444">&gt; root@rhel:~#</text>
  </g>

  <!-- Titles -->
  <text x="400" y="260" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="800" font-size="34" fill="#ffffff" letter-spacing="2">
    RED HAT ACADEMY
  </text>
  <text x="400" y="305" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="600" font-size="19" fill="#ee0000" letter-spacing="3">
    LINUX &amp; SYSTEM ADMINISTRATION
  </text>
  <text x="400" y="348" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="400" font-size="15" fill="#94a3b8" letter-spacing="1">
    RH104 (Fundamentals) • RH124 (SysAdmin I) • RH134 (SysAdmin II)
  </text>
</svg>
